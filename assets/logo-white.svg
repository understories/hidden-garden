<svg width="256" height="320" viewBox="0 0 32 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-white">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Soil/pot base -->
  <ellipse cx="16" cy="36" rx="10" ry="4" fill="#ffffff" fillOpacity="0.9"/>
  <ellipse cx="16" cy="35" rx="8" ry="3" fill="#ffffff" fillOpacity="0.8"/>
  
  <!-- Stem -->
  <path
    d="M 16 36 Q 16 30, 16 24 Q 16 20, 16 16"
    stroke="#ffffff"
    strokeWidth="2"
    strokeLinecap="round"
    fill="none"
    strokeOpacity="0.9"
  />
  
  <!-- Left leaf - organic, flowing shape -->
  <path
    d="M 16 16 
       Q 10 14, 8 10
       Q 6 8, 8 6
       Q 10 4, 12 6
       Q 14 8, 14 10
       Q 14 12, 16 14
       Z"
    fill="#ffffff"
    fillOpacity="0.95"
    stroke="#ffffff"
    strokeWidth="0.5"
    strokeOpacity="0.8"
    filter="url(#glow-white)"
  />
  
  <!-- Right leaf - organic, flowing shape -->
  <path
    d="M 16 16 
       Q 22 14, 24 10
       Q 26 8, 24 6
       Q 22 4, 20 6
       Q 18 8, 18 10
       Q 18 12, 16 14
       Z"
    fill="#ffffff"
    fillOpacity="0.95"
    stroke="#ffffff"
    strokeWidth="0.5"
    strokeOpacity="0.8"
    filter="url(#glow-white)"
  />
  
  <!-- Center leaf - smaller, at the top -->
  <path
    d="M 16 16 
       Q 14 12, 16 8
       Q 18 12, 16 16
       Z"
    fill="#ffffff"
    fillOpacity="0.98"
    stroke="#ffffff"
    strokeWidth="0.5"
    strokeOpacity="0.8"
    filter="url(#glow-white)"
  />
  
  <!-- Leaf veins - subtle details -->
  <path
    d="M 16 16 Q 12 12, 10 8"
    stroke="#ffffff"
    strokeWidth="0.5"
    strokeOpacity="0.5"
    fill="none"
  />
  <path
    d="M 16 16 Q 20 12, 22 8"
    stroke="#ffffff"
    strokeWidth="0.5"
    strokeOpacity="0.5"
    fill="none"
  />
  <path
    d="M 16 16 L 16 10"
    stroke="#ffffff"
    strokeWidth="0.5"
    strokeOpacity="0.5"
    fill="none"
  />
</svg>

